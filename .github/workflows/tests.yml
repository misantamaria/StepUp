name: Tests del Sistema de Progreso

on:
  push:
    branches: [ main, develop, gestion ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stepup_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v3
      with:
        python-version: 3.11
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r app/requirements.txt
        pip install pytest-django pytest-cov
    
    - name: Set up environment variables
      run: |
        echo "DEBUG=True" >> $GITHUB_ENV
        echo "DATABASE_URL=postgres://postgres:postgres@localhost:5432/stepup_test" >> $GITHUB_ENV
        echo "SECRET_KEY=test-secret-key-for-github-actions" >> $GITHUB_ENV
    
    - name: Run Django migrations
      run: |
        cd app
        python manage.py migrate --settings=stepup_config.settings
    
    - name: Create test superuser
      run: |
        cd app
        python manage.py shell -c "
        from django.contrib.auth.models import User
        if not User.objects.filter(username='admin').exists():
            User.objects.create_superuser('admin', 'admin@test.com', 'admin123', is_staff=True)
        print('Superuser created')
        "
    
    - name: Run Django tests
      run: |
        cd app
        python manage.py test tests.test_progreso_alumnos --verbosity=2
    
    - name: Run pytest tests
      run: |
        cd app
        pytest tests/test_progreso_alumnos.py -v --tb=short
    
    - name: Run custom verification tests
      run: |
        cd app
        python tests/test_progreso_sistema.py
    
    - name: Generate coverage report
      run: |
        cd app
        pytest tests/ --cov=core.profesor --cov=boards.views.profesor --cov-report=xml
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./app/coverage.xml
        fail_ci_if_error: false