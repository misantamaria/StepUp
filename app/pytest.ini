[tool:pytest]
DJANGO_SETTINGS_MODULE = stepup_config.settings
python_files = tests*.py test*.py *test*.py
testpaths = tests
addopts = 
    --reuse-db
    --nomigrations
    --tb=short
    --strict-markers
python_classes = Test*
python_functions = test_*
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests