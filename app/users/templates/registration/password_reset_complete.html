{% extends "base.html" %}

{% block title %}Contraseña restablecida - StepUp{% endblock %}

{% block content %}
  <div class="card" style="max-width: 600px; margin: 2rem auto; text-align: center;">
    <h2 style="color: #667eea; margin-bottom: 1.5rem;">✅ Contraseña restablecida</h2>
    
    <div class="message success">
      Tu contraseña ha sido cambiada exitosamente.
    </div>
    
    <p style="margin: 2rem 0;">Ya puedes iniciar sesión con tu nueva contraseña.</p>
    
    <a href="/accounts/login/" style="display: inline-block; padding: 0.75rem 2rem; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; text-decoration: none; border-radius: 6px; font-weight: 600;">
      Ir al login
    </a>
  </div>
{% endblock %}
